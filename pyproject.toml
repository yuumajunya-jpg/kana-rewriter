[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kana-rewriter"
version = "0.1.0"
description = "Rewrite committed Japanese text using a local LLM on Windows"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
local = ["llama-cpp-python>=0.3,<0.4"]
desktop = ["comtypes>=1.4,<2; sys_platform == 'win32'"]

[project.scripts]
kana-rewriter = "kana_rewriter.__main__:main"

[tool.setuptools.packages.find]
include = ["kana_rewriter*"]
