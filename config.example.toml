backend = "llama_cpp"
# この設定ファイルからの相対パス、または絶対パス
model_path = "models/jinen-v1-xsmall-Q5_K_M.gguf"
model_format = "jinen_v1" # 専用マーカー + 生のcompletion API。左文脈対応
context_chars = 64 # 文脈の最大文字数
conversion_delimiters = "。" # Kで左へ走査するときの区切り。各文字を区切りとして扱う
stop_at_kanji = true # Kの走査を漢字で止める
trailing_punctuation = "。、？！?!,.，．" # カーソル直前で飛ばして保持する記号。区切りとは別設定
hotkey_line = "Ctrl+Enter" # カーソル左の区切りまで変換
hotkey_selection = "Ctrl+Shift+Enter" # 選択範囲を変換
hotkey_quit = "" # 任意の終了キー。例: "Ctrl+Alt+Q"。空文字列なら登録しない
edit_backend = "auto" # auto: 標準Edit/RichEditはWin32、それ以外はUIA。clipboardで旧方式
editor_worker = "python" # C++版をビルドして比較する場合は "native"。推論バックエンドとは独立
# native_worker_path = "build/native/kana-editor-worker.exe" # この設定ファイルからの相対パス
native_uia_wait = "poll" # C++版のみ。"event"でTextChanged通知＋期限付き照会を比較（実験用）
uia_ime_check = "auto" # Chromiumの残存範囲は中止判定に使わない。strictは厳密判定、offは照会なし
uia_readback_initial_delay_ms = 0 # 比較用: 送信後の初回照会まで0〜100ms。まず0と10で比較
editor_timeout_seconds = 5 # 編集APIの応答待機。応答不明時は再送しない
max_document_chars = 200000 # 本文取得の上限。超えた入力欄は中止
n_ctx = 0 # GGUFの学習時のコンテキスト長を使用
n_gpu_layers = 0 # CPU。GPU対応版を入れた場合は -1 で全層をGPUへ
# 汎用チャットモデルを使う場合: model_format = "chat"
# jinen v2の場合は上の2項目を変更:
# model_path = "models/jinen-v2-small-Q5_K_M.gguf"
# model_format = "jinen_v2" # 左文脈対応、プロンプト全体をNFKC正規化
# zenz-v3.2の場合: model_format = "zenz_v3_2"（左右文脈。独自ランタイムが必要）
# chat_format = "chatml" # chatの場合のみ

# 任意: backend = "http" にすると外部のローカルサーバーを使用
endpoint = "http://127.0.0.1:8080/v1/completions" # 変換専用モデル用。chatは /v1/chat/completions
model = "local"
# Ollama: endpoint = "http://127.0.0.1:11434/v1/chat/completions"
# modelには ollama list に表示されるモデル名を指定します。
timeout_seconds = 30 # HTTPの場合のみ。直接推論の時間制限ではありません
max_chars = 1000
max_tokens = 256
paste_wait_seconds = 0.1 # ブラウザー等へCtrl+Vを送った後のクリップボード復元待機
# 認証が必要な場合、キーを格納した環境変数名を指定
api_key_env = "KANA_REWRITER_API_KEY"
