# この設定ファイルからの相対パス、または絶対パス
model_path = "models/zenz-v3.2-xsmall/ggml-model-Q5_K_M.gguf"
model_format = "zenz_v3_2" # 左右文脈対応。completion APIへ
context_chars = 64 # 文脈の最大文字数
conversion_delimiters = "。" # Kで左へ走査するときの区切り。各文字を区切りとして扱う
stop_at_kanji = true # Kの走査を漢字・カタカナで止める
preview_enabled = true # 入力欄付近の変換プレビュー（--no-previewで一時無効化）
trailing_punctuation = "。、？！?!,.，．" # カーソル直前で飛ばして保持する記号。区切りとは別設定
hotkey_line = "Ctrl+Enter" # カーソル左の区切りまで変換
hotkey_selection = "Ctrl+Shift+Enter" # 選択範囲を変換
# 日本語キーボードでは上の2行を "半角全角" / "Shift+半角全角" に変更可能
# "半角/全角"、"HankakuZenkaku"なども同じキー。設定変更後は再起動
hotkey_quit = "" # 任意の終了キー。例: "Ctrl+Alt+Q"。空文字列なら登録しない
auto_replace_on_ime_commit = false # true: TSFでEnterを伴うIME確定後に確定範囲を自動変換。Ctrl+Enter確定は置換しない。TSF直接編集
# tsf_edit_path = "build/tsf-edit-probe/kana-tsf-edit-<ビルド時刻>.dll" # 省略時は最新ビルド
edit_backend = "auto" # auto: 標準Edit/RichEditはWin32、それ以外はUIA
uia_ime_check = "auto" # Chromiumの残存範囲は中止判定に使わない。strictは厳密判定、offは照会なし
uia_readback_initial_delay_ms = 0 # 比較用: 送信後の初回照会まで0〜100ms。まず0と10で比較
editor_timeout_seconds = 5 # 編集APIの応答待機。応答不明時は再送しない
max_document_chars = 200000 # 本文取得の上限。超えた入力欄は中止
n_ctx = 0 # GGUFの学習時のコンテキスト長を使用
n_gpu_layers = 0 # CPU。GPU対応版を入れた場合は -1 で全層をGPUへ
# 汎用チャットモデルを使う場合: model_format = "chat"
# jinen v2 smallを使う場合は上のmodel_pathを変更（model_formatは同じ）:
# model_path = "models/jinen-v2-small-Q5_K_M.gguf"
# model_format = "jinen_v2" # 左文脈対応、プロンプト全体をNFKC正規化
# jinen v1を使う場合はmodel_pathとmodel_formatを両方変更:
# model_path = "models/jinen-v1-xsmall-Q5_K_M.gguf"
# model_format = "jinen_v1"
# zenz-v3.2-xsmallを使う場合: model_path = "models/zenz-v3.2-xsmall/ggml-model-Q5_K_M.gguf"、
# model_format = "zenz_v3_2"。pre-tokenizer名は読込時にアプリが上書きする
# chat_format = "chatml" # chatの場合のみ

max_chars = 1000
max_tokens = 256
